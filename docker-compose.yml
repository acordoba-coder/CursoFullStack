services:
  angular-app:
    build: .
    image: angular11-node12
    container_name: cotizacionfront-app
    working_dir: /app
    volumes:
      - ./cotizacionfront-app:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    command: sh -c "npm install && ng serve --host 0.0.0.0 --poll 2000"