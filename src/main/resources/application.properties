spring.application.name=cotizacion
server.port=9090

# Cambia la URL para acceder al HTML de Swagger
springdoc.swagger-ui.path=/swagger-ui.html
# Cambia la URL donde se genera el JSON con la especificación OpenAPI v3
springdoc.api-docs.path=/api-docs

# Database connection settings
spring.datasource.url=jdbc:postgresql://localhost:5432/mi_db_test
spring.datasource.username=admin
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver