<h2>Posts</h2>
<label class="search-label">
  Filtrar por ID de autor (1-10):
  <input type="number" min="1" max="20" [formControl]="userIdControl" placeholder="Ej: 3">
</label>

<p *ngIf="loading$ | async">Cargando posts...</p>

<ul class="post-list">
  <li class="post-item" *ngFor="let post of posts$ | async">
    <h3>{{ post.title }}</h3>
    <p>{{ post.body }}</p>
  </li>
</ul>
