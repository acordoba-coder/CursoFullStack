<h2>Posts</h2>
<label class="search-label">
  Filtrar por ID de autor (1-10):
  <input type="number" min="1" max="20" [formControl]="userIdControl" placeholder="Ej: 3">
</label>

<p *ngIf="loading$ | async">Cargando posts...</p>

<ul class="post-list">
  <li class="post-item" *ngFor="let post of posts$ | async">
     <button
      type="button"
      class="favorite-toggle"
      [class.active]="post.isFavorite"
      (click)="toggleFavorite(post)"
      [attr.aria-label]="post.isFavorite ? 'Quitar de favoritos' : 'Agregar a favoritos'"
    >{{ post.isFavorite ? '★' : '☆' }}</button>
    <h3>{{ post.title | titlecase}}</h3>
    <p>{{ post.body | truncate:90}}</p>
<a routerLink="/posts/{{ post.id }}">Read More</a>  </li>
</ul>
